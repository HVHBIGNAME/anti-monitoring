" class="mono">1</text><path d="M32 301H1168" stroke="#30392c"/><text x="35" y="328" fill="#a1ad9b" font-size="14" font-weight="400" text-anchor="start" class="mono">SOURCE-DERIVED COUNTS / YOUR MACHINE IS MEASURED BY antimon --scan --json</text>

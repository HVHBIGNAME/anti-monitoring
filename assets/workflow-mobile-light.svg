<svg xmlns="http://www.w3.org/2000/svg" width="600" height="416" viewBox="0 0 600 416" role="img" aria-labelledby="title desc">
  <title id="title">Scan → plan → apply → verify</title>
  <desc id="desc">A readable two-by-two control loop for small screens.</desc>
  <style>text { font-family: Arial, Helvetica, sans-serif; } .mono { font-family: 'Courier New', Courier, monospace; }</style>
  <rect x=".5" y=".5" width="599" height="415" rx="18" fill="#f3f2e9" stroke="#cdd3c0"/>
<text x="26" y="40" fill="#616d55" font-size="20" font-weight="400" text-anchor="start" class="mono">THE CONTROL LOOP</text><rect x="26" y="74" width="264" height="122" rx="10" fill="#e9ebdf" stroke="#cdd3c0"/><text x="44" y="103" fill="#496817" font-size="19" font-weight="400" text-anchor="start" class="mono">01</text><text x="44" y="142" fill="#20271b" font-size="32" font-weight="700" text-anchor="start">SCAN</text><text x="44" y="172" fill="#616d55" font-size="19" font-weight="400" text-anchor="start">Find guest components</text><rect x="310" y="74" width="264" height="122" rx="10" fill="#e9ebdf" stroke="#cdd3c0"/><text x="328" y="103" fill="#496817" font-size="19" font-weight="400" text-anchor="start" class="mono">02</text><text x="328" y="142" fill="#20271b" font-size="32" font-weight="700" text-anchor="start">PLAN</text><text x="328" y="172" fill="#616d55" font-size="19" font-weight="400" text-anchor="start">Review exact targets</text><rect x="26" y="228" width="264" height="122" rx="10" fill="#e9ebdf" stroke="#cdd3c0"/><text x="44" y="257" fill="#496817" font-size="19" font-weight="400" text-anchor="start" class="mono">03</text><text x="44" y="296" fill="#20271b" font-size="32" font-weight="700" text-anchor="start">APPLY</text><text x="44" y="326" fill="#616d55" font-size="19" font-weight="400" text-anchor="start">Record, then change</text><rect x="310" y="228" width="264" height="122" rx="10" fill="#e9ebdf" stroke="#cdd3c0"/><text x="328" y="257" fill="#496817" font-size="19" font-weight="400" text-anchor="start" class="mono">04</text><text x="328" y="296" fill="#20271b" font-size="32" font-weight="700" text-anchor="start">VERIFY</text><text x="328" y="326" fill="#616d55" font-size="19" font-weight="400" text-anchor="start">Confirm the result</text><text x="26" y="387" fill="#616d55" font-size="18" font-weight="400" text-anchor="start" class="mono">RESTORE / Keep the recovery snapshot.</text>
</svg>

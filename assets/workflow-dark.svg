<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc">
  <title id="title">Scan → plan → apply → verify</title>
  <desc id="desc">Read-only scan, explicit selection, recorded changes and verified state. Service snapshots support restoration.</desc>
  <style>text { font-family: Arial, Helvetica, sans-serif; } .mono { font-family: 'Courier New', Courier, monospace; }</style>
  <rect x=".5" y=".5" width="1199" height="239" rx="18" fill="#101310" stroke="#30392c"/>
<text x="34" y="39" fill="#a1ad9b" font-size="15" font-weight="400" text-anchor="start" class="mono">THE CONTROL LOOP</text><rect x="32" y="63" width="266" height="117" rx="10" fill="#171c16" stroke="#30392c"/>
<text x="50" y="94" fill="#d2ff5a" font-size="18" font-weight="400" text-anchor="start" class="mono">01</text><text x="50" y="128" fill="#f0f2e8" font-size="27" font-weight="700" text-anchor="start">SCAN</text><text x="50" y="156" fill="#a1ad9b" font-size="16" font-weight="400" text-anchor="start">Find packages + services</text><path d="M305 120h12m-5-5 5 5-5 5" fill="none" stroke="#d2ff5a"/><rect x="326" y="63" width="266" height="117" rx="10" fill="#171c16" stroke="#30392c"/>
<text x="344" y="94" fill="#d2ff5a" font-size="18" font-weight="400" text-anchor="start" class="mono">02</text><text x="344" y="128" fill="#f0f2e8" font-size="27" font-weight="700" text-anchor="start">PLAN</text><text x="344" y="156" fill="#a1ad9b" font-size="16" font-weight="400" text-anchor="start">Choose exactly what changes</text><path d="M599 120h12m-5-5 5 5-5 5" fill="none" stroke="#d2ff5a"/><rect x="620" y="63" width="266" height="117" rx="10" fill="#171c16" stroke="#30392c"/>
<text x="638" y="94" fill="#d2ff5a" font-size="18" font-weight="400" text-anchor="start" class="mono">03</text><text x="638" y="128" fill="#f0f2e8" font-size="27" font-weight="700" text-anchor="start">APPLY</text><text x="638" y="156" fill="#a1ad9b" font-size="16" font-weight="400" text-anchor="start">Record state, then act</text><path d="M893 120h12m-5-5 5 5-5 5" fill="none" stroke="#d2ff5a"/><rect x="914" y="63" width="266" height="117" rx="10" fill="#171c16" stroke="#30392c"/>
<text x="932" y="94" fill="#d2ff5a" font-size="18" font-weight="400" text-anchor="start" class="mono">04</text><text x="932" y="128" fill="#f0f2e8" font-size="27" font-weight="700" text-anchor="start">VERIFY</text><text x="932" y="156" fill="#a1ad9b" font-size="16" font-weight="400" text-anchor="start">Check the actual result</text><text x="34" y="216" fill="#a1ad9b" font-size="16" font-weight="400" text-anchor="start" class="mono">RESTORE / Saved service state. Package reinstallation is a separate operation.</text>
</svg>

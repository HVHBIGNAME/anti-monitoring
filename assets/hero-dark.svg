<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Anti-Monitoring — Less noise. More control.</title>
  <desc id="desc">Linux guest-agent control by HVHBIGNAME. Scan, review a plan, apply and restore service state.</desc>
  <style>text { font-family: Arial, Helvetica, sans-serif; } .mono { font-family: 'Courier New', Courier, monospace; }</style>
  <rect x=".5" y=".5" width="1199" height="439" rx="18" fill="#101310" stroke="#30392c"/>
<defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#30392c" stroke-width=".65"/></pattern></defs>
<style>
  .mobile { display: none; }
  .pulse { animation: pulse 4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
  @media (max-width: 600px) { .desktop { display: none; } .mobile { display: inline; } }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
</style>
<g class="desktop">
<path d="M32 78H1168M32 367H1168" stroke="#30392c"/>
<path d="M44 29v24m10-24v24m-10-12h10m14-12 9 24 9-24" fill="none" stroke="#d2ff5a" stroke-width="3"/>
<text x="105" y="49" fill="#f0f2e8" font-size="20" font-weight="700" text-anchor="start">HVHBIGNAME / LINUX TOOLS</text>
<text x="1155" y="47" fill="#a1ad9b" font-size="13" font-weight="400" text-anchor="end" class="mono">CONTROL / 02</text>
<text x="44" y="125" fill="#a1ad9b" font-size="17" font-weight="400" text-anchor="start" class="mono">ANTI-MONITORING</text>
<text x="38" y="221" fill="#f0f2e8" font-size="90" font-weight="900" text-anchor="start">LESS NOISE.</text>
<text x="38" y="312" fill="#d2ff5a" font-size="82" font-weight="900" text-anchor="start">MORE CONTROL.</text>
<rect x="798" y="100" width="357" height="244" fill="url(#grid)" opacity=".65"/>
<g transform="translate(970 220)">
  <circle r="129" fill="none" stroke="#30392c"/>
  <circle r="106" fill="none" stroke="#30392c" stroke-dasharray="2 8"/>
  <path d="M-155 0H155M0-140V140" stroke="#30392c"/>
  <path d="M0-95 92-42V43L0 97-92 43V-42Z" fill="#171c16" stroke="#d2ff5a" stroke-width="1.5"/>
  <path d="m-92-42 92 52 92-52M0 10v87M-46-69v86l46 27 46-27v-86" fill="none" stroke="#d2ff5a" opacity=".35"/>
  <rect x="-39" y="-48" width="78" height="74" rx="8" fill="#344620" stroke="#d2ff5a"/>
  <path d="m-18-13 12 11 26-28" fill="none" stroke="#d2ff5a" stroke-width="5"/>
  <circle cx="-130" r="5" fill="#d2ff5a" class="pulse"/>
  <circle cx="130" r="5" fill="#d2ff5a"/>
  <text x="0" y="-146" fill="#a1ad9b" font-size="12" font-weight="400" text-anchor="middle" class="mono">OBSERVE</text>
  <text x="0" y="149" fill="#a1ad9b" font-size="12" font-weight="400" text-anchor="middle" class="mono">DECIDE</text>
</g>
<circle cx="48" cy="403" r="4" fill="#d2ff5a" class="pulse"/>
<text x="63" y="408" fill="#f0f2e8" font-size="13" font-weight="400" text-anchor="start" class="mono">POSIX SH / LOCAL REPORTS / EXPLICIT ACTIONS</text>
<text x="1155" y="408" fill="#a1ad9b" font-size="13" font-weight="400" text-anchor="end" class="mono">SCAN → PLAN → APPLY</text>
</g>
<g class="mobile">
<path d="M42 108H1158" stroke="#30392c"/>
<text x="45" y="73" fill="#a1ad9b" font-size="39" font-weight="700" text-anchor="start">HVHBIGNAME / ANTI-MONITORING</text>
<text x="38" y="250" fill="#f0f2e8" font-size="154" font-weight="900" text-anchor="start">YOUR VM.</text>
<text x="38" y="389" fill="#d2ff5a" font-size="141" font-weight="900" text-anchor="start">YOUR CHOICE.</text>
</g>
</svg>

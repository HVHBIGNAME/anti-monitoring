name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-contracts:
    name: Shell / ${{ matrix.shell }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shell: [dash, bash, "busybox ash"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install check tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck busybox
      - name: ShellCheck
        run: shellcheck -s sh antimon.sh install.sh uninstall.sh tests/*.sh
      - name: Stateful contracts and report validation
        env:
          ANTIMON_TEST_SHELL: ${{ matrix.shell }}
        run: python3 -m unittest discover -s tests -v
      - name: Verify generated files
        run: |
          python3 tools/checksums.py --check
          python3 tools/generate_assets.py --check

  distributions:
    name: Native packages / ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: [debian12, debian13, ubuntu22, ubuntu24, fedora, rocky, opensuse, arch, alpine, void]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Real scan, installation and package removal in disposable container
        env:
          TARGET: ${{ matrix.target }}
        run: python3 tests/run_containers.py --only "$TARGET" --jobs 1
      - name: Upload native test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.target }}
          path: reports/containers/
          if-no-files-found: error
          retention-days: 14

  live-systemd:
    name: Live systemd round trip
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Preview, disable, repeat, restore and clean up isolated unit
        run: sudo sh tests/systemd-integration.sh
